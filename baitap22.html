<!DOCTYPE html>
<html lang="vi">
<head>

  <style>

    .container { max-width: 1000px; margin: 0 auto; background: #1e293b; padding: 25px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.3); }
    h1 { color: #38bdf8; margin-bottom: 15px; }
    .img-wrapper { margin: 20px 0; border-radius: 8px; overflow: hidden; border: 1px solid #334155; }
    .img-wrapper img { width: 100%; height: auto; display: block; }
    .back-btn { display: inline-block; background: #0284c7; color: white; text-decoration: none; padding: 10px 20px; border-radius: 6px; font-weight: bold; margin-top: 15px; }
    .back-btn:hover { background: #0369a1; }
  </style>
</head>
<body>

  <div class="container">
    <h1>Kết Quả Bài Tập 22</h1>
    <p>Tóm tắt đánh giá hiệu suất làm bài</p>
    
    <div class="img-wrapper">
      <img src="images/baitap22.jpg" alt="Tóm tắt đánh giá của Huy">

    <a href="index.html" class="back-btn">&larr; Quay về Trang Chủ</a>

</html>
